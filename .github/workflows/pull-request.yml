name: iOS Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests (no UI tests)
    if: github.event.pull_request.draft == false
    runs-on: macos-26
    # Fastlane requires a UTF-8 locale:
    # https://docs.fastlane.tools/getting-started/ios/setup/#set-up-environment-variables
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Add path globally
        run: echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Xcode project
        id: xcode
        run: |
          if [ -d "delivery-game.xcodeproj" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No delivery-game.xcodeproj yet — skipping iOS build."
          fi

      - name: Install Ruby gems
        if: steps.xcode.outputs.present == 'true'
        run: bundle install

      - name: Run unit tests
        if: steps.xcode.outputs.present == 'true'
        env:
          WORKSPACE: ${{ github.workspace }}
          PROJECT_FILENAME: "delivery-game.xcodeproj"
          SCHEME: "delivery-game"
        run: bundle exec fastlane runUnitTests

      - name: Upload test results on failure
        if: failure() && steps.xcode.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fastlane/test_output/
          if-no-files-found: ignore
