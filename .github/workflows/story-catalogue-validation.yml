name: Story catalogue validation

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "docs/planning/story-catalogue/**"
      - "scripts/validate_story_catalogue.py"
      - "tests/test_validate_story_catalogue.py"
      - ".github/workflows/story-catalogue-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate story catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run catalogue validator unit tests
        run: python -m unittest tests.test_validate_story_catalogue -v

      - name: Validate story catalogue registry
        run: python scripts/validate_story_catalogue.py
