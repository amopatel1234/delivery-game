name: Merged

# Continuous TestFlight upload on merge to main.
# No GitHub Releases / Versioning action — build numbers come from TestFlight.
on:
  push:
    branches: [main]
    paths:
      - "delivery-game/**"
      - "delivery-game.xcodeproj/**"
      - "fastlane/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/merged.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build app and deploy to TestFlight
    runs-on: macos-26
    # Fastlane requires a UTF-8 locale:
    # https://docs.fastlane.tools/getting-started/ios/setup/#set-up-environment-variables
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Add path globally
        run: echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Xcode project
        id: xcode
        run: |
          if [ -d "delivery-game.xcodeproj" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No delivery-game.xcodeproj yet — skipping TestFlight deploy."
          fi

      - name: Create Distribution P12
        if: steps.xcode.outputs.present == 'true'
        run: |
          if [ -z "$CERTIFICATE_VALUE" ]; then
            echo "Error: DISTRIBUTION_CERTIFICATE secret is not set"
            exit 1
          fi
          echo -n "$CERTIFICATE_VALUE" | base64 --decode -o distribution.p12
        env:
          CERTIFICATE_VALUE: ${{ secrets.DISTRIBUTION_CERTIFICATE }}

      - name: Install Ruby gems
        if: steps.xcode.outputs.present == 'true'
        run: bundle install

      - name: Deploy to TestFlight
        if: steps.xcode.outputs.present == 'true'
        run: bundle exec fastlane deploy
        env:
          # Official Fastlane App Store Connect API env vars:
          # https://docs.fastlane.tools/actions/app_store_connect_api_key/
          APP_STORE_CONNECT_API_KEY_KEY_ID: "6986A95Z65"
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: "69a6de86-2dd0-47e3-e053-5b8c7c11a4d1"
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.KEY_VALUE }}
          APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "false"
          APP_STORE_CONNECT_API_KEY_IN_HOUSE: "false"
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_PASSWORD }}
